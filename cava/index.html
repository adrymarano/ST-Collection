<title>Cava Marano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Libro de bodega: cabecera fija con pestañas, columna única de registros;
   cada vino lleva su propia línea de guarda con la marca de "hoy". */
:root{
  --bg:#F7F5F8; --surface:#FFFFFF; --surface-2:#F1EDF3; --ink:#1B1520; --ink-2:#574C60;
  --muted:#7C7187; --line:#E3DCE9; --line-2:#CFC5D8;
  --accent:#6E2B57; --accent-ink:#FFFFFF; --accent-soft:#F3E6EE;
  --guardar:#2B55C0; --pico:#0E8A74; --anio:#A8780A; --ya:#BE1E45; --pasado:#7C7187;
  --guardar-bg:#E8EDFB; --pico-bg:#E0F2EE; --anio-bg:#F7EFDC; --ya-bg:#FBE6EB; --pasado-bg:#EEEAF1;
  --bar:#6E2B57; --bar-track:#EDE6F1;
  --shadow:0 1px 2px rgba(27,21,32,.06), 0 8px 24px -16px rgba(27,21,32,.25);
  --display:"Bodoni Moda", "Times New Roman", serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141019; --surface:#1D1724; --surface-2:#261E2F; --ink:#F2EDF5; --ink-2:#C4B8CE;
  --muted:#9A8EA6; --line:#312839; --line-2:#453A50;
  --accent:#D492BD; --accent-ink:#231A2A; --accent-soft:#33243040;
  --guardar:#4F7FE0; --pico:#17A18A; --anio:#C08310; --ya:#E04E63; --pasado:#9A8EA6;
  --guardar-bg:#1B2440; --pico-bg:#11302C; --anio-bg:#2F2512; --ya-bg:#3A1A23; --pasado-bg:#262030;
  --bar:#C07FAC; --bar-track:#2A2232;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1D1724; --surface-2:#261E2F; --ink:#F2EDF5; --ink-2:#C4B8CE;
  --muted:#9A8EA6; --line:#312839; --line-2:#453A50;
  --accent:#D492BD; --accent-ink:#231A2A; --accent-soft:#33243040;
  --guardar:#4F7FE0; --pico:#17A18A; --anio:#C08310; --ya:#E04E63; --pasado:#9A8EA6;
  --guardar-bg:#1B2440; --pico-bg:#11302C; --anio-bg:#2F2512; --ya-bg:#3A1A23; --pasado-bg:#262030;
  --bar:#C07FAC; --bar-track:#2A2232;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
header{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line)}
.head-in{max-width:960px; margin:0 auto; padding-block:12px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.brand h1{font-family:var(--display); font-size:26px; font-weight:600; letter-spacing:-.01em}
.brand .sub{font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.brand .spacer{flex:1 1 auto; min-width:0}
.icon-btn{background:none; border:1px solid var(--line-2); border-radius:8px; padding:5px 9px; color:var(--ink-2); font-size:13px}
.icon-btn:hover{border-color:var(--accent); color:var(--accent)}
nav{display:flex; gap:2px; margin-top:12px; overflow-x:auto; scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px 10px;
  color:var(--muted); font-weight:500; font-size:14px; white-space:nowrap}
nav button[aria-current="true"]{color:var(--ink); border-bottom-color:var(--accent)}

/* ---------- cuerpo ---------- */
main{max-width:960px; margin:0 auto; padding-block:20px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
section[hidden]{display:none !important}
.lede{color:var(--ink-2); font-size:14px; margin:0 0 16px; max-width:62ch}
#aviso{background:var(--anio-bg); border:1px solid var(--anio); border-radius:var(--r);
  padding:12px 14px; margin-bottom:18px; font-size:13.5px; line-height:1.5; color:var(--ink)}
#aviso strong{color:var(--anio)}
#aviso .diag{display:block; font-family:var(--mono); font-size:12px; margin-top:6px; color:var(--ink-2)}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:22px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; min-width:0}
.tile .k{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.tile .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:23px; line-height:1.2; margin-top:4px}
.tile .n{font-size:12px; color:var(--muted); margin-top:2px}
.tile .k,.tile .v,.tile .n{display:block}
button.tile{font:inherit; color:inherit; text-align:left; width:100%; cursor:pointer}
button.tile:hover:not(:disabled){border-color:var(--line-2); background:var(--surface-2)}
button.tile:disabled{cursor:default; opacity:.55}
button.chip{border:0; font:inherit; cursor:pointer}
button.chip:hover{background:var(--line)}

.grupo{margin-bottom:26px}
.grupo-h{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.grupo-h h2{font-family:var(--display); font-size:19px; font-weight:600}
.grupo-h .cnt{font-family:var(--mono); font-size:12px; color:var(--muted)}
.grupo-h .rule{flex:1 1 40px; height:1px; background:var(--line); min-width:0}
.grupo-nota{font-size:13px; color:var(--muted); margin:-4px 0 10px; max-width:62ch}

ul.lista{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.fila{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:start; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--borde,var(--line));
  border-radius:var(--r); padding:11px 13px}
.fila:hover{border-color:var(--line-2); border-left-color:var(--borde,var(--line-2))}
/* min-width fija: sin ella la columna se comprime cuando el chip de estado
   es largo, y la botella queda en una astilla ilegible. */
.thumb{width:54px; min-width:54px; height:72px; border-radius:6px; object-fit:cover; object-position:center;
  background:var(--surface-2); border:1px solid var(--line)}
.thumb.ph{display:grid; place-items:center; font-family:var(--display); font-size:21px; color:var(--muted)}
.fila .mid{min-width:0}
.nom{font-weight:600; font-size:15px; line-height:1.3}
.nom .et{font-family:var(--display); font-weight:600}
.meta{font-size:12.5px; color:var(--ink-2); margin-top:2px; display:flex; flex-wrap:wrap; gap:0 7px}
.meta .sep{color:var(--line-2)}
.rasgos{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.rasgo{font-size:11px; line-height:1.4; padding:2px 7px; border-radius:5px; white-space:nowrap;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.right{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px; white-space:nowrap}
.precio{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px}
.precio.est::after{content:"≈"; color:var(--muted); margin-left:3px; font-size:11px}
.bot{font-size:11.5px; color:var(--muted)}

.chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; letter-spacing:.03em;
  padding:3px 8px; border-radius:999px; white-space:nowrap}
.chip .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.chip.guardar{color:var(--guardar); background:var(--guardar-bg)}
.chip.pico{color:var(--pico); background:var(--pico-bg)}
.chip.anio{color:var(--anio); background:var(--anio-bg)}
.chip.ya{color:var(--ya); background:var(--ya-bg)}
.chip.pasado{color:var(--pasado); background:var(--pasado-bg)}
.chip.plain{color:var(--ink-2); background:var(--surface-2)}

/* Línea de guarda. Eje fijo de hoy a 2040 en todas las filas: con cada barra
   en su propia escala no se pueden comparar dos vinos de un vistazo. */
.linea{margin-top:13px; position:relative; height:24px}
.track{position:absolute; inset:15px 0 auto; height:6px; border-radius:3px; background:var(--bar-track); overflow:hidden}
.marca{position:absolute; top:0; font-family:var(--mono); font-size:10.5px; line-height:1; font-weight:500;
  white-space:nowrap; color:var(--ink)}
.marca.abre{color:var(--ink-2)}
.tick{position:absolute; top:12px; width:2px; height:12px; border-radius:1px; background:var(--ink); opacity:.5}
.seg{position:absolute; top:0; height:100%}
.seg.pre{background:var(--guardar); opacity:.32}
.seg.vent{background:var(--pico); opacity:.85}
.seg.post{background:var(--ya); opacity:.38}
.linea-pies{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:3px}
.linea-pies span:nth-child(2){flex:1 1 auto; min-width:0; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* filtros */
.filtros{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.filtros input[type=search], .filtros select{background:var(--surface); border:1px solid var(--line-2);
  border-radius:8px; padding:7px 10px; font-size:14px; min-width:0}
.filtros input[type=search]{flex:1 1 180px}
.tog{display:flex; gap:0; border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
.tog button{background:var(--surface); border:0; padding:7px 11px; font-size:13px; color:var(--ink-2)}
.tog button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

/* barras de estadística */
.barras{display:flex; flex-direction:column; gap:7px}
.barra{display:grid; grid-template-columns:minmax(84px,30%) 1fr auto; gap:10px; align-items:center}
.barra .lbl{font-size:13px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.barra .tr{background:var(--bar-track); border-radius:3px; height:10px; min-width:0}
.barra .fi{background:var(--bar); height:100%; border-radius:0 4px 4px 0; min-width:3px}
.barra .vl{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2); white-space:nowrap}

.tarjeta{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; margin-bottom:16px}
.tarjeta h3{font-family:var(--display); font-size:17px; font-weight:600; margin-bottom:12px}

/* ranking */
.rk{display:grid; grid-template-columns:auto auto 1fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .pos{font-family:var(--mono); font-size:12px; color:var(--muted); width:2.2em; text-align:right}
.rk .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px}
.rk .pr{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13.5px}

/* vacío */
.vacio{background:var(--surface); border:1px dashed var(--line-2); border-radius:var(--r); padding:28px 20px; text-align:center}
.vacio h3{font-family:var(--display); font-size:19px; font-weight:600; margin-bottom:6px}
.vacio p{color:var(--ink-2); font-size:14px; margin:0 auto 14px; max-width:40ch}

/* botón flotante */
.fab{position:fixed; z-index:25;
  right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:999px;
  padding:13px 20px; font-weight:600; font-size:15px; box-shadow:var(--shadow)}

/* hojas / modales */
.ov{position:fixed; inset:0; z-index:40; background:rgba(20,14,24,.5); display:flex; align-items:flex-end; justify-content:center}
@media (min-width:640px){ .ov{align-items:center} }
.hoja{background:var(--surface); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; border:1px solid var(--line);
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px)); padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){ .hoja{border-radius:16px} }
.hoja-h{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.hoja-h h2{font-family:var(--display); font-size:21px; font-weight:600; flex:1 1 auto; min-width:0}
.campos{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.campo{display:flex; flex-direction:column; gap:4px; min-width:0}
.campo.ancho{grid-column:1 / -1}
.campo label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.campo input, .campo select, .campo textarea{background:var(--bg); border:1px solid var(--line-2);
  border-radius:8px; padding:8px 10px; font-size:15px; width:100%}
.campo textarea{resize:vertical; min-height:56px}
.acciones{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px}
.btn{border:1px solid var(--line-2); background:var(--surface); border-radius:9px; padding:10px 15px; font-weight:600; font-size:14px}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.dan{color:var(--ya); border-color:var(--ya)}
.btn.gh{border-color:transparent; color:var(--ink-2)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.full{flex:1 1 140px}
.opciones{display:flex; flex-direction:column; gap:10px}
.opcion{display:flex; gap:13px; align-items:center; text-align:left; background:var(--bg);
  border:1px solid var(--line-2); border-radius:12px; padding:14px 15px; width:100%}
.opcion .em{font-family:var(--display); font-size:22px; color:var(--accent); width:28px; text-align:center; flex:none}
.opcion .tt{display:block; font-weight:600; font-size:15px}
.opcion .ds{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}
.preview{width:100%; max-height:230px; object-fit:contain; border-radius:10px; background:var(--surface-2)}
.foto-caja{display:flex; flex-direction:column; gap:9px; margin-bottom:15px}
.foto-vista{min-width:0}
.foto-vacia{display:grid; place-items:center; align-content:center; gap:3px; height:104px;
  border:1px dashed var(--line-2); border-radius:10px; background:var(--bg); color:var(--muted); font-size:13px}
.foto-vacia .em{font-family:var(--display); font-size:21px; color:var(--line-2); line-height:1}
.foto-btns{display:flex; gap:8px; flex-wrap:wrap}
/* El input de archivo va encima del botón, transparente: así el toque cae sobre
   el input de verdad y no depende de un .click() por JS, que algunos visores de
   Android ignoran sin avisar. */
.arch{position:relative; overflow:hidden; cursor:pointer}
.btn.arch{display:inline-flex; align-items:center; justify-content:center}
.arch input[type=file]{position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:0; cursor:pointer}
.arch:focus-within{outline:2px solid var(--accent); outline-offset:2px}
.arch.off{opacity:.55; cursor:not-allowed}
.arch.off input[type=file]{cursor:not-allowed}
.estado-msg{font-size:13.5px; color:var(--ink-2); padding:10px 12px; background:var(--surface-2); border-radius:8px; margin-bottom:12px}
.estado-msg.err{color:var(--ya); background:var(--ya-bg)}
.nota{font-size:12px; color:var(--muted); margin-top:10px}
.cargando{display:inline-block; width:11px; height:11px; border:2px solid var(--line-2); border-top-color:var(--accent);
  border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .cargando{animation-duration:3s} }
.toast{position:fixed; z-index:50; left:50%; transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg);
  padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:500; box-shadow:var(--shadow); max-width:90vw}
@media (max-width:460px){
  .campos{grid-template-columns:1fr}
  .fila{grid-template-columns:auto minmax(0,1fr)}
  .fila .right{grid-column:2; flex-direction:row; align-items:center; flex-wrap:wrap;
    gap:6px 10px; justify-content:flex-start; white-space:normal}
}
</style>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>Cava Marano</h1>
      <span class="sub" id="resumen-head">cargando…</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-cfg" title="Ajustes">Ajustes</button>
    </div>
    <nav id="nav" role="tablist">
      <button role="tab" data-v="tomar" aria-current="true">Qué tomar</button>
      <button role="tab" data-v="cava">La cava</button>
      <button role="tab" data-v="precios">Precios</button>
      <button role="tab" data-v="numeros">Números</button>
    </nav>
  </div>
</header>

<main>
  <div id="aviso" role="status" hidden></div>
  <section id="v-tomar"></section>
  <section id="v-cava" hidden></section>
  <section id="v-precios" hidden></section>
  <section id="v-numeros" hidden></section>
</main>

<button class="fab" id="fab">+ Agregar vino</button>

<script>
(function(){
"use strict";

/* ============== constantes de dominio ============== */

const HOY = new Date();
const ANIO = HOY.getFullYear();

// Eje común de todas las líneas de guarda.
const EJE_INI = ANIO;
const EJE_FIN = 2040;

// Ventana de guarda de referencia, en años después de la cosecha,
// expresada para un vino de gama "reserva". El escalón de gama la estira o la acorta.
const VENTANAS = {
  "malbec":[3,10], "cabernet sauvignon":[4,14], "cabernet franc":[3,12], "bonarda":[2,7],
  "syrah":[3,10], "shiraz":[3,10], "merlot":[2,8], "pinot noir":[2,8], "tannat":[4,12],
  "petit verdot":[4,12], "tempranillo":[3,9], "sangiovese":[2,8], "ancellotta":[2,7],
  "marselan":[3,10], "garnacha":[2,8], "grenache":[2,8], "mourvedre":[3,10], "nebbiolo":[4,14],
  "corte":[3,12], "blend":[3,12], "chardonnay":[1,5], "sauvignon blanc":[0,2],
  "torrontes":[0,2], "semillon":[1,6], "viognier":[0,3], "chenin blanc":[1,4],
  "pedro gimenez":[0,2], "criolla":[0,2], "moscatel":[0,3], "riesling":[1,8], "gewurztraminer":[0,3]
};
// [factor inicio, factor fin] por gama
const GAMAS = {
  joven:       {f:[0,.32],  n:"Joven / sin madera"},
  roble:       {f:[.6,.65], n:"Roble"},
  reserva:     {f:[1,1],    n:"Reserva"},
  granReserva: {f:[1.35,1.4], n:"Gran Reserva"},
  icono:       {f:[1.7,1.6],  n:"Ícono / alta gama"}
};
const ES_RESERVA = {joven:false, roble:false, reserva:true, granReserva:true, icono:true};

// Características de cata. Van como etiquetas en cada fila, en lugar de la
// ubicación: la región ocupa media línea y no ayuda a elegir qué abrir.
const CUERPO = {ligero:"Ligero", medio:"Cuerpo medio", corpulento:"Corpulento"};
const TANINO = {suave:"Taninos suaves", medio:"Taninos medios", firme:"Taninos firmes"};
const ACIDEZ = {baja:"Acidez baja", media:"Acidez media", alta:"Acidez alta"};

function rasgosDe(v){
  const r = [];
  if(CUERPO[v.cuerpo]) r.push(CUERPO[v.cuerpo]);
  if(v.tipo === "tinto" ? TANINO[v.tanino] : ACIDEZ[v.acidez])
    r.push(v.tipo === "tinto" ? TANINO[v.tanino] : ACIDEZ[v.acidez]);
  if(typeof v.crianzaMeses === "number")
    r.push(v.crianzaMeses > 0 ? `${v.crianzaMeses} meses de roble` : "Sin madera");
  const per = (v.perfil||[]).filter(Boolean);
  if(per.length) r.push(per.slice(0,2).join(" · "));
  return r;
}

function limpiarRasgos(d){
  const en = (x, ok) => ok.indexOf(x) >= 0 ? x : null;
  const num = x => { const n = parseFloat(x); return isFinite(n) ? n : null; };
  const meses = num(d.crianzaMeses);
  return {
    cuerpo: en(d.cuerpo, ["ligero","medio","corpulento"]),
    tanino: en(d.tanino, ["suave","medio","firme"]),
    acidez: en(d.acidez, ["baja","media","alta"]),
    crianzaMeses: meses === null ? null : Math.max(0, Math.round(meses)),
    alcohol: num(d.alcohol),
    perfil: Array.isArray(d.perfil) ? d.perfil.map(x=>String(x).trim()).filter(Boolean).slice(0,4) : [],
    maridaje: String(d.maridaje||"").trim().slice(0,90)
  };
}

// Estar "dentro de la ventana" no alcanza: una cava joven cae entera en ese
// cajón y no contesta nada. Lo que ordena es cuánto falta para que la ventana
// se cierre, así que el tramo de adentro se parte en dos.
const ESTADOS = {
  ya:      {n:"Tomar ya",       tile:"Tomar ya",   cls:"ya",      color:"var(--ya)",      orden:0},
  anio:    {n:"Tomar este año", tile:"Este año",   cls:"anio",    color:"var(--anio)",    orden:1},
  pronto:  {n:"Abrir primero",  tile:"Abrir primero", cls:"anio", color:"var(--anio)",    orden:2},
  pico:    {n:"Con tiempo",     tile:"Con tiempo", cls:"pico",    color:"var(--pico)",    orden:3},
  guardar: {n:"Guardar",        tile:"Guardar",    cls:"guardar", color:"var(--guardar)", orden:4},
  sinDatos:{n:"Falta la añada", tile:"Sin añada",  cls:"pasado",  color:"var(--pasado)",  orden:5},
  pasado:  {n:"Posiblemente pasado", tile:"Pasados", cls:"pasado", color:"var(--pasado)", orden:-1}
};

// Tramos de horizonte: cuánta ventana le queda a una botella desde hoy.
// Son los cuadros del resumen y, al tocarlos, el filtro del listado.
const HORIZ = [
  {k:"venc", n:"Ya vencidos",    c:"var(--ya)",      t:r=>r!==null&&r<=0},
  {k:"h2",   n:"2 años o menos", c:"var(--anio)",    t:r=>r!==null&&r>=1&&r<=2},
  {k:"h5",   n:"3 a 5 años",     c:"var(--pico)",    t:r=>r!==null&&r>=3&&r<=5},
  {k:"h10",  n:"6 a 10 años",    c:"var(--guardar)", t:r=>r!==null&&r>=6&&r<=10},
  {k:"hx",   n:"Más de 10 años", c:"var(--accent)",  t:r=>r!==null&&r>10},
  {k:"sa",   n:"Sin añada",      c:"var(--pasado)",  t:r=>r===null}
];

const BANDAS = [
  {k:"bajo",    n:"Bajo"},
  {k:"medio",   n:"Medio"},
  {k:"alto",    n:"Alto"},
  {k:"muyAlto", n:"Muy alto"}
];

// Anclas de precio minorista en Argentina relevadas en octubre de 2026.
// Sirven para calibrar la estimación: sin ellas el modelo contesta con precios viejos.
const ANCLAS = [
  "Alamos Malbec ~ $4.500", "López Malbec ~ $4.400", "Portillo Malbec ~ $6.600",
  "Lamadrid Terroir Selection Malbec ~ $11.000", "Rutini Cabernet Sauvignon ~ $30.000",
  "Rutini Cabernet Franc ~ $32.800", "Luigi Bosca De Sangre ~ $45.400",
  "Angélica Zapata Cabernet Franc ~ $45.700", "Rutini Single Vineyard Gualtallary ~ $66.000",
  "Catena Zapata Malbec Argentino ~ $135.000", "íconos y alta gama $160.000 a $230.000"
].join(" · ");

const CFG_DEF = {
  bandas:{bajo:12000, medio:35000, alto:80000},   // topes en ARS
  dolar:1565,
  relevado:"octubre 2026"
};

/* ============== estado ============== */

const S = {
  vinos:[], cfg:Object.assign({}, CFG_DEF), view:"tomar",
  q:"", fEstado:"", fVar:"", fReserva:"", fHoriz:"", orden:"urgencia",
  listo:false, db:null, sample:null, assets:null, descargas:null,
  puedeImagenes:false, escribible:null
};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sinAcento = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const fmtArs = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const fmtNum = new Intl.NumberFormat("es-AR");
const pesos = n => (n==null || !isFinite(n)) ? "—" : fmtArs.format(Math.round(n));
const plural = (n,s,p) => n===1 ? s : (p||s+"s");

/* ============== cálculo ============== */

function uvaPrincipal(v){
  const u = (v.varietales||[]).filter(Boolean);
  if(!u.length) return "";
  return u[0];
}

function claveUva(v){
  const u = sinAcento(uvaPrincipal(v));
  if(!u) return "";
  if((v.varietales||[]).length > 1) return "corte";
  for(const k of Object.keys(VENTANAS)) if(u === k) return k;
  for(const k of Object.keys(VENTANAS)) if(u.includes(k)) return k;
  return "";
}

// Ventana de guarda: la cargada a mano manda; si no, se deriva de uva + gama + tipo.
function ventana(v){
  if(v.ventanaDesde && v.ventanaHasta) return {desde:+v.ventanaDesde, hasta:+v.ventanaHasta, propia:true};
  const cosecha = +v.anada;
  if(!cosecha) return null;
  let base;
  const tipo = sinAcento(v.tipo);
  if(tipo === "espumante") base = v.gama==="icono" || v.gama==="granReserva" ? [1,6] : [0,3];
  else if(tipo === "rosado") base = [0,2];
  else if(tipo === "dulce") base = [1,10];
  else base = VENTANAS[claveUva(v)] || [2,8];
  const f = (GAMAS[v.gama] || GAMAS.reserva).f;
  const desde = cosecha + Math.round(base[0]*f[0]);
  const hasta = cosecha + Math.max(1, Math.round(base[1]*f[1]));
  return {desde, hasta:Math.max(hasta, desde+1), propia:false};
}

function estado(v){
  const w = ventana(v);
  if(!w) return {k:"sinDatos", w:null, faltan:0, restan:0};
  if(ANIO > w.hasta + 2) return {k:"pasado", w, faltan:0, restan:0};
  if(ANIO >= w.hasta)    return {k:"ya", w, faltan:0, restan:0};
  if(ANIO < w.desde)     return {k:"guardar", w, faltan:w.desde-ANIO, restan:w.hasta-ANIO};
  const restan = w.hasta - ANIO;
  if(restan === 1) return {k:"anio", w, faltan:0, restan};
  if(restan <= 3)  return {k:"pronto", w, faltan:0, restan};
  return {k:"pico", w, faltan:0, restan};
}

function banda(v, cfg){
  const p = +v.precioArs;
  if(!p) return null;
  if(p < cfg.bandas.bajo) return "bajo";
  if(p < cfg.bandas.medio) return "medio";
  if(p < cfg.bandas.alto) return "alto";
  return "muyAlto";
}

const restaDe = v => { const w = ventana(v); return w ? w.hasta - ANIO : null; };
const esReserva = v => v.esReserva != null ? !!v.esReserva : !!ES_RESERVA[v.gama];
const cant = v => Math.max(0, +v.cantidad || 0);
const valor = v => (+v.precioArs || 0) * cant(v);

function ordenar(lista, modo){
  const c = [...lista];
  if(modo === "urgencia") c.sort((a,b)=>{
    const ea = estado(a), eb = estado(b);
    const oa = ESTADOS[ea.k].orden, ob = ESTADOS[eb.k].orden;
    if(oa !== ob) return oa - ob;
    const wa = ea.w ? ea.w.hasta : 9999, wb = eb.w ? eb.w.hasta : 9999;
    return wa - wb;
  });
  else if(modo === "precio") c.sort((a,b)=>(+b.precioArs||0)-(+a.precioArs||0));
  else if(modo === "anada") c.sort((a,b)=>(+a.anada||9999)-(+b.anada||9999));
  else c.sort((a,b)=> (a.bodega+a.etiqueta).localeCompare(b.bodega+b.etiqueta,"es"));
  return c;
}

/* ============== piezas de render ============== */

function chipEstado(e){
  const d = ESTADOS[e.k];
  const extra = e.k==="guardar" ? ` ${e.faltan} ${plural(e.faltan,"año")}`
    : (e.restan ? ` · ${e.restan} ${plural(e.restan,"año")}` : "");
  const tit = e.k==="guardar" ? `Le faltan ${e.faltan} ${plural(e.faltan,"año")} para entrar en su ventana`
    : (e.restan ? `Su ventana se cierra en ${e.restan} ${plural(e.restan,"año")}` : esc(d.n));
  return `<span class="chip ${d.cls}" title="${esc(tit)}"><span class="dot"></span>${esc(d.n)}${extra}</span>`;
}

function lineaGuarda(v){
  const e = estado(v);
  if(!e.w) return "";
  const span = EJE_FIN - EJE_INI;
  const pct = y => Math.max(0, Math.min(100, ((y - EJE_INI) / span) * 100));
  const p = pct(e.w.desde);                        // dónde se abre la ventana
  const a = pct(Math.max(e.w.desde, EJE_INI));     // tramo bebible que queda
  const b = pct(e.w.hasta);                        // el quiebre de verde a rojo
  // El año va sobre el quiebre, pegado al borde cuando está en una punta
  // para que no se salga de la fila.
  const marca = (x, anio, cls) => {
    const al = x < 10 ? "translateX(0)" : (x > 90 ? "translateX(-100%)" : "translateX(-50%)");
    return `<span class="marca ${cls}" style="left:${x.toFixed(1)}%; transform:${al}">${anio}</span>
      <span class="tick" style="left:calc(${x.toFixed(1)}% - 1px)"></span>`;
  };
  return `<div class="linea" title="Ventana de guarda ${e.w.desde}–${e.w.hasta}">
    <div class="track">
      ${e.w.desde > EJE_INI ? `<span class="seg pre" style="left:0; width:${p.toFixed(1)}%"></span>` : ""}
      ${b > a ? `<span class="seg vent" style="left:${a.toFixed(1)}%; width:${Math.max(1.5,b-a).toFixed(1)}%"></span>` : ""}
      <span class="seg post" style="left:${b.toFixed(1)}%; width:${Math.max(0,100-b).toFixed(1)}%"></span>
    </div>
    ${e.w.desde > EJE_INI ? marca(p, e.w.desde, "abre") : ""}
    ${b > 0 && b < 100 ? marca(b, e.w.hasta, "cierra") : ""}
  </div>
  <div class="linea-pies"><span>hoy ${EJE_INI}</span><span>ventana ${e.w.propia?"cargada a mano":"estimada"}</span><span>${EJE_FIN}</span></div>`;
}

function fila(v, opts){
  opts = opts || {};
  const e = estado(v);
  const uvas = (v.varietales||[]).join(" · ");
  const meta = [uvas, v.anada||"s/añada", (GAMAS[v.gama]||{}).n].filter(Boolean);
  const rr = rasgosDe(v);
  const foto = v.fotoUrl
    ? `<img class="thumb" src="${esc(v.fotoUrl)}" alt="">`
    : `<div class="thumb ph" aria-hidden="true">${esc((v.bodega||"?").trim().charAt(0).toUpperCase())}</div>`;
  return `<li><button class="fila" data-id="${esc(v.id)}" style="--borde:${ESTADOS[e.k].color}">
    ${foto}
    <div class="mid">
      <div class="nom">${esc(v.bodega||"Sin bodega")} <span class="et">${esc(v.etiqueta||"")}</span></div>
      <div class="meta">${meta.map(m=>esc(m)).join(' <span class="sep">·</span> ')}</div>
      ${rr.length ? `<div class="rasgos">${rr.map(x=>`<span class="rasgo">${esc(x)}</span>`).join("")}</div>` : ""}
      ${opts.sinLinea ? "" : lineaGuarda(v)}
    </div>
    <div class="right">
      ${opts.sinChip ? "" : chipEstado(e)}
      <span class="precio ${v.precioFuente==="estimado"?"est":""}">${pesos(+v.precioArs)}</span>
      <span class="bot">${cant(v)} ${plural(cant(v),"botella")}</span>
    </div>
  </button></li>`;
}

function barras(items, total){
  if(!items.length) return `<p class="lede">Todavía no hay datos.</p>`;
  const max = Math.max(...items.map(i=>i.v), 1);
  return `<div class="barras">` + items.map(i=>`
    <div class="barra">
      <span class="lbl" title="${esc(i.k)}">${esc(i.k)}</span>
      <span class="tr"><span class="fi" style="width:${Math.max(3,(i.v/max)*100).toFixed(1)}%"></span></span>
      <span class="vl">${fmtNum.format(i.v)}${total?` · ${Math.round(i.v/total*100)}%`:""}</span>
    </div>`).join("") + `</div>`;
}

function cuenta(lista, fn){
  const m = new Map();
  for(const v of lista){
    const ks = fn(v);
    for(const k of (Array.isArray(ks)?ks:[ks])){
      if(!k) continue;
      m.set(k, (m.get(k)||0) + cant(v));
    }
  }
  return [...m].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v || String(a.k).localeCompare(String(b.k),"es"));
}

/* ============== vistas ============== */

function vacio(titulo, texto){
  return `<div class="vacio"><h3>${esc(titulo)}</h3><p>${esc(texto)}</p>

}

  // Los grupos de abajo contestan qué hacer con cada vino, y es normal que

    pico:"Dentro de su ventana y con cuatro años o más por delante. No hay apuro.",

function renderCava(){
  const el = $("#v-cava");
  if(!S.listo){ el.innerHTML = `<p class="lede"><span class="cargando"></span>Abriendo la cava…</p>`; return; }

    if(q && !sinAcento([v.bodega,v.etiqueta,(v.varietales||[]).join(" "),v.region,v.anada].join(" ")).includes(q)) return false;

      <option value="">Todo varietal</option>

    <div class="tog" role="group" aria-label="Reserva">

    </div>
    <select id="f-orden" aria-label="Ordenar">
      <option value="urgencia" ${S.orden==="urgencia"?"selected":""}>Por urgencia</option>
      <option value="precio" ${S.orden==="precio"?"selected":""}>Por precio</option>
      <option value="anada" ${S.orden==="anada"?"selected":""}>Por añada</option>
      <option value="nombre" ${S.orden==="nombre"?"selected":""}>Por nombre</option>
    </select>
  </div>
  <p class="lede">${lista.length} ${plural(lista.length,"etiqueta")} · ${botellas} ${plural(botellas,"botella")}${lista.length!==S.vinos.length?` (de ${S.vinos.length} en total)`:""}. Tocá una fila para editarla o descontar una botella.</p>
  ${lista.length ? `<ul class="lista">${lista.map(v=>fila(v)).join("")}</ul>`
    : `<div class="vacio"><h3>Ningún vino coincide</h3><p>Probá con otro filtro o limpiá la búsqueda.</p></div>`}`;
}

let cerrarHoja = null;
function hoja(html, montar){
  cerrar();
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="hoja" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", e => { if(e.target === ov) cerrar(); });
  const onKey = e => { if(e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", onKey);
  cerrarHoja = () => { document.removeEventListener("keydown", onKey); ov.remove(); cerrarHoja = null; };
  if(montar) montar(ov.querySelector(".hoja"));
  const f = ov.querySelector("input,select,textarea,button");
  if(f && window.matchMedia("(min-width:640px)").matches) f.focus();
  return ov.querySelector(".hoja");
}
function cerrar(){ if(cerrarHoja) cerrarHoja(); }

let toastT = null;
function toast(msg){
  const prev = document.querySelector(".toast");
  if(prev) prev.remove();
  clearTimeout(toastT);
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t);
  toastT = setTimeout(()=>t.remove(), 3200);
}

function leerForm(base){
  const g = id => $("#c-"+id) ? $("#c-"+id).value.trim() : "";
  const n = id => { const x = parseInt(g(id),10); return isFinite(x) ? x : null; };
  const out = Object.assign({}, base, {
    bodega:g("bodega"), etiqueta:g("etiqueta"),
    varietales:g("var").split(",").map(s=>s.trim()).filter(Boolean),
    anada:n("anada"), region:g("region"), tipo:g("tipo"), gama:g("gama"),
    cantidad:Math.max(0, n("cant")||0), notas:g("notas"),
    ventanaDesde:n("vd"), ventanaHasta:n("vh"),
    cuerpo:g("cuerpo")||null, tanino:g("tanino")||null, acidez:g("acidez")||null,
    crianzaMeses: g("crianza")==="" ? null : Math.max(0, n("crianza")||0),
    alcohol: g("alcohol")==="" ? null : (parseFloat(g("alcohol").replace(",",".")) || null),
    perfil: g("perfil").split(",").map(s=>s.trim()).filter(Boolean).slice(0,4),
    maridaje: g("maridaje")
  });
  const p = n("precio");
  if(p !== (base.precioArs ?? null)) out.precioFuente = "manual";
  out.precioArs = p;
  out.esReserva = ES_RESERVA[out.gama];
  return out;
}

// Foto del vino: se puede agregar, cambiar o quitar en cualquier momento,
// sea el vino nuevo o uno que ya está en la cava.
function montarFoto(el, foto){
  const caja = el.querySelector(".foto-caja");
  if(!caja) return;
  const inps = Array.prototype.slice.call(caja.querySelectorAll("input[type=file]"));
  const bAdd = caja.querySelector("[data-foto]");
  const bGal = caja.querySelector("[data-gal]");
  const txt = bAdd.querySelector(".txt");
  const bDel = caja.querySelector("[data-qfoto]");
  const pintar = () => {
    caja.querySelector(".foto-vista").innerHTML = foto.fotoUrl
      ? `<img class="preview" src="${esc(foto.fotoUrl)}" alt="Foto del vino">`
      : `<div class="foto-vacia"><span class="em">◉</span><span>Sin foto todavía</span></div>`;
    bDel.hidden = !foto.fotoUrl;
    bGal.hidden = !S.assets;
    for(const i of inps) i.disabled = !S.assets;
    bAdd.classList.toggle("off", !S.assets);
    txt.textContent = !S.assets ? "No puedo guardar fotos acá"
      : (foto.fotoUrl ? "Cambiar foto" : "Sacar foto");
  };
  pintar();
  const subir = async inp => {
    const f = inp.files && inp.files[0];
    if(!f || !S.assets) return;
    for(const i of inps) i.disabled = true;
    txt.innerHTML = `<span class="cargando"></span>Subiendo…`;
    try{
      const chico = await achicar(f, 900);
      const up = await S.assets.upload(chico);
      const viejo = foto.fotoId;
      foto.fotoId = up.id; foto.fotoUrl = up.url;
      if(viejo && viejo !== up.id) S.assets.delete(viejo).catch(()=>{});
    }catch(e){ toast("No pude subir esa foto. Probá con un JPG o PNG."); }
    finally{ for(const i of inps) i.value = ""; pintar(); }
  };
  for(const i of inps) i.onchange = () => subir(i);
  bDel.onclick = () => {
    const viejo = foto.fotoId;
    foto.fotoId = null; foto.fotoUrl = null;
    if(viejo && S.assets) S.assets.delete(viejo).catch(()=>{});
    pintar();
    toast("Foto quitada. Guardá el vino para confirmarlo.");
  };
}

function achicar(file, lado){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const e = Math.min(1, lado / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*e); c.height = Math.round(img.height*e);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("no-blob")), "image/jpeg", .85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("no-img")); };
    img.src = url;
  });
}

const PROMPT = `Sos sommelier y trabajás con vinos argentinos. En la imagen hay la etiqueta de una botella.

Leé la etiqueta y devolvé SOLO un objeto JSON con estas claves exactas:
{"legible":true,"bodega":"","etiqueta":"","varietales":["Malbec"],"anada":2019,"region":"","tipo":"tinto","gama":"reserva","precioArs":25000,"ventanaDesde":2022,"ventanaHasta":2029,"cuerpo":"medio","tanino":"firme","acidez":"media","crianzaMeses":12,"alcohol":14.5,"perfil":["ciruela","violetas","vainilla"],"maridaje":"","notas":"","confianza":0.8}

Reglas:
- "legible": false si la foto no es una etiqueta de vino o no se lee nada. En ese caso dejá el resto vacío o en null.
- "varietales": los nombres de uva tal como se escriben en español ("Malbec", "Cabernet Franc", "Syrah"). Si es un corte sin uvas declaradas, poné ["Corte"].
- "anada": el año de cosecha como número. null si no figura.
- "tipo": uno de tinto, blanco, rosado, espumante, dulce.
- "gama": uno de joven, roble, reserva, granReserva, icono. Usá lo que diga la etiqueta y lo que sepas de esa línea de esa bodega. "joven" para vinos sin paso por madera.
- "precioArs": precio minorista aproximado de una botella de 750 ml en una vinoteca argentina HOY, en pesos argentinos, como número entero sin separadores. Calibralo con estas referencias relevadas en octubre de 2026: ANCLAS_AQUI. Dólar libre de referencia: DOLAR_AQUI pesos. No uses precios de otros años ni de otros países: los precios argentinos en pesos suben todos los años.
- "ventanaDesde" y "ventanaHasta": años calendario entre los que ese vino se toma en su mejor momento, contando desde la cosecha y según su gama real.
- "cuerpo": ligero, medio o corpulento. "tanino": suave, medio o firme, o null en blancos y rosados. "acidez": baja, media o alta.
- "crianzaMeses": meses de crianza en roble, entero. 0 si no pasó por madera, null si no sabés.
- "alcohol": grado alcohólico aproximado, con un decimal.
- "perfil": de dos a cuatro descriptores aromáticos en español, una palabra cada uno.
- "maridaje": una línea corta, menos de 60 caracteres.
- "notas": una sola línea, menos de 120 caracteres, con lo más útil para decidir cuándo abrirlo.
- "confianza": 0 a 1, qué tan seguro estás de lo que leíste.
No agregues texto fuera del JSON.`;

async function leerEtiqueta(file){
  let blob;
  try { blob = await achicar(file, 1600); }
  catch(e){ toast("No pude leer esa imagen"); return; }
  const fotoUrl = URL.createObjectURL(blob);

  const ctl = new AbortController();
  hoja(`
    <div class="hoja-h"><h2>Leyendo la etiqueta</h2></div>
    <img class="preview" src="${fotoUrl}" alt="Foto de la etiqueta">
    <div class="estado-msg" id="paso"><span class="cargando"></span>Mirando la foto…</div>
    <div class="acciones"><button class="btn gh" data-stop="1">Cancelar</button></div>
  `, el => { el.querySelector("[data-stop]").onclick = () => { ctl.abort(); cerrar(); }; });

  const prompt = PROMPT.replace("ANCLAS_AQUI", ANCLAS).replace("DOLAR_AQUI", String(S.cfg.dolar));
  let d;
  try{
    d = await S.sample.json(prompt, {images:[blob], modelTier:"complex", signal:ctl.signal, cache:false});
  }catch(e){
    if(e && e.code === "cancelled") return;
    const copia = {
      not_granted:"No autorizaste a esta página a usar Claude. Podés cargar el vino a mano.",
      rate_limited:"Claude está ocupado o llegaste al límite de uso. Probá en un rato.",
      invalid_json:"La respuesta vino mal formada. Probá de nuevo con una foto más nítida.",
      image_rejected:"Esa imagen no se pudo procesar. Probá con otra foto.",
      refused:"Claude no quiso responder sobre esa imagen."
    };
    const p = document.querySelector("#paso");
    if(p){ p.className = "estado-msg err"; p.textContent = (copia[e && e.code] || "No pude leer la etiqueta. Probá de nuevo o cargalo a mano."); }
    const acc = document.querySelector(".acciones");
    if(acc) acc.innerHTML = `<button class="btn pri full" id="r-manual">Cargarlo a mano</button><button class="btn gh" id="r-cerrar">Cerrar</button>`;
    const rm = document.querySelector("#r-manual");
    if(rm) rm.onclick = () => abrirEditor({cantidad:1, tipo:"tinto", gama:"reserva"}, "Vino nuevo");
    const rc = document.querySelector("#r-cerrar");
    if(rc) rc.onclick = cerrar;
    return;
  }

  if(!d || d.legible === false){
    const p = document.querySelector("#paso");
    if(p){ p.className = "estado-msg err"; p.textContent = "No reconocí una etiqueta de vino en esa foto."; }
    const acc = document.querySelector(".acciones");
    if(acc){
      acc.innerHTML = `<button class="btn pri full" id="r-manual">Cargarlo a mano</button><button class="btn gh" id="r-cerrar">Cerrar</button>`;
      document.querySelector("#r-manual").onclick = () => abrirEditor({cantidad:1, tipo:"tinto", gama:"reserva"}, "Vino nuevo");
      document.querySelector("#r-cerrar").onclick = cerrar;
    }
    return;
  }

  const paso = document.querySelector("#paso");
  if(paso) paso.innerHTML = `<span class="cargando"></span>Guardando la foto…`;

  let fotoId = null, fotoFinal = null;
  if(S.assets){
    try{
      const chico = await achicar(file, 900);
      const up = await S.assets.upload(chico);
      fotoId = up.id; fotoFinal = up.url;
    }catch(e){ /* la foto es opcional: sigue con la copia local */ }
  }

  const conf = typeof d.confianza === "number" ? d.confianza : null;
  const v = Object.assign(limpiarRasgos(d), {
    bodega: String(d.bodega||"").trim(),
    etiqueta: String(d.etiqueta||"").trim(),
    varietales: Array.isArray(d.varietales) ? d.varietales.map(x=>String(x).trim()).filter(Boolean) : [],
    anada: parseInt(d.anada,10) || null,
    region: String(d.region||"").trim(),
    tipo: ["tinto","blanco","rosado","espumante","dulce"].includes(d.tipo) ? d.tipo : "tinto",
    gama: Object.keys(GAMAS).includes(d.gama) ? d.gama : "reserva",
    cantidad: 1,
    precioArs: parseInt(d.precioArs,10) || null,
    precioFuente: "estimado",
    ventanaDesde: parseInt(d.ventanaDesde,10) || null,
    ventanaHasta: parseInt(d.ventanaHasta,10) || null,
    notas: String(d.notas||"").trim(),
    fotoId, fotoUrl: fotoFinal,
    _aviso: `Leído de la etiqueta${conf!=null?` · confianza ${Math.round(conf*100)}%`:""}. El precio y las características son estimaciones: revisalas antes de guardar.`
  });
  abrirEditor(v, "Revisá lo que leí");
}

/* ---- ajustes ---- */

// Los vinos cargados antes de que existieran estos campos no tienen cata.
// Una sola consulta para todos en vez de una por vino: más rápido y más barato.
async function completarRasgos(){
  if(!S.sample){ toast("Claude no está disponible en este visor"); return; }
  const faltan = S.vinos.filter(v=>!v.cuerpo);
  if(!faltan.length){ toast("Ya tienen características todos los vinos"); return; }

  const ctl = new AbortController();
  hoja(`<div class="hoja-h"><h2>Completar características</h2></div>
    <div class="estado-msg" id="paso"><span class="cargando"></span>Preguntando por ${faltan.length} ${plural(faltan.length,"vino")}…</div>
    <div class="acciones"><button class="btn gh" data-stop="1">Cancelar</button></div>`,
    el => { el.querySelector("[data-stop]").onclick = () => { ctl.abort(); cerrar(); }; });

  const lista = faltan.map((v,i)=>`${i+1}. ${v.bodega||""} ${v.etiqueta||""} ${v.anada||"sin añada"} — ${(v.varietales||[]).join("/")||"sin varietal"} — ${v.region||"sin región"} — ${(GAMAS[v.gama]||{}).n||""}`).join("\n");
  const prompt = `Sos sommelier y conocés los vinos argentinos. Para cada vino de esta lista devolvé sus características de cata.

${lista}

Devolvé SOLO un array JSON, un objeto por vino, en el mismo orden y con el mismo "n":
[{"n":1,"cuerpo":"medio","tanino":"firme","acidez":"media","crianzaMeses":12,"alcohol":14.5,"perfil":["ciruela","violetas","vainilla"],"maridaje":"Carnes rojas a la parrilla"}]

Reglas:
- "cuerpo": ligero, medio o corpulento. "tanino": suave, medio o firme, o null si es blanco o rosado. "acidez": baja, media o alta.
- "crianzaMeses": meses en roble, entero. 0 si no pasó por madera, null si no sabés.
- "alcohol": grado aproximado, con un decimal.
- "perfil": de dos a cuatro descriptores aromáticos en español, una palabra cada uno.
- "maridaje": una línea corta, menos de 60 caracteres.
Si no conocés un vino en particular, deducí por varietal, región y gama. No dejes ninguno afuera.`;

  let arr;
  try{
    arr = await S.sample.json(prompt, {modelTier:"complex", signal:ctl.signal, cache:false});
  }catch(e){
    if(e && e.code === "cancelled") return;
    const p = document.querySelector("#paso");
    if(p){ p.className = "estado-msg err"; p.textContent = "No pude completarlas. Probá de nuevo en un rato."; }
    return;
  }
  if(!Array.isArray(arr)){
    const p = document.querySelector("#paso");
    if(p){ p.className = "estado-msg err"; p.textContent = "La respuesta vino con otra forma. Probá de nuevo."; }
    return;
  }

  const p = document.querySelector("#paso");
  if(p) p.innerHTML = `<span class="cargando"></span>Guardando…`;
  let n = 0;
  for(const d of arr){
    const v = faltan[(parseInt(d && d.n, 10) || 0) - 1];
    if(!v) continue;
    await guardar(Object.assign({}, v, limpiarRasgos(d)));
    n++;
  }
  cerrar();
  toast(n ? `${n} ${plural(n,"vino")} ${plural(n,"completado")}` : "No se completó ninguno");
}

    <div class="campos">
      <div class="campo ancho"><label>Cortes de las bandas de costo (ARS)</label></div>
      <div class="campo"><label for="a-bajo">Bajo hasta</label><input id="a-bajo" class="num" inputmode="numeric" value="${esc(c.bandas.bajo)}"></div>
      <div class="campo"><label for="a-medio">Medio hasta</label><input id="a-medio" class="num" inputmode="numeric" value="${esc(c.bandas.medio)}"></div>

  `, el => {

      const nuevo = {bandas:{bajo:n("bajo")||CFG_DEF.bandas.bajo, medio:n("medio")||CFG_DEF.bandas.medio, alto:n("alto")||CFG_DEF.bandas.alto},
        dolar:n("dolar")||CFG_DEF.dolar, relevado:c.relevado};
      S.cfg = nuevo;
      if(S.db){ try{ await S.db.doc("config/app").set(nuevo); }catch(e){} }
      cerrar(); render(); toast("Ajustes guardados");
    };
    el.querySelector("[data-csv]").onclick = exportarCsv;
    el.querySelector("[data-rasgos]").onclick = completarRasgos;
    el.querySelector("[data-ej]").onclick = async () => {
      const ej = S.vinos.filter(v=>v.ejemplo);
      if(!ej.length){ toast("No quedan ejemplos"); return; }
      for(const v of ej) await borrar(v.id);
      cerrar(); toast(`${ej.length} ${plural(ej.length,"ejemplo")} ${plural(ej.length,"borrado")}`);

}

function exportarCsv(){
  const cab = ["Bodega","Etiqueta","Varietales","Añada","Región","Tipo","Gama","Reserva","Botellas","Precio ARS","Origen precio","Ventana desde","Ventana hasta","Momento","Cuerpo","Taninos","Acidez","Roble (meses)","Alcohol","Perfil","Maridaje","Notas"];
  const q = s => '"' + String(s==null?"":s).replace(/"/g,'""') + '"';
  const filas = ordenar(S.vinos,"urgencia").map(v=>{
    const e = estado(v);
    return [v.bodega, v.etiqueta, (v.varietales||[]).join(" / "), v.anada, v.region, v.tipo,
      (GAMAS[v.gama]||{}).n, esReserva(v)?"Sí":"No", cant(v), v.precioArs,
      v.precioFuente==="estimado"?"Estimado":"Manual",
      e.w?e.w.desde:"", e.w?e.w.hasta:"", ESTADOS[e.k].n,
      CUERPO[v.cuerpo]||"", TANINO[v.tanino]||"", ACIDEZ[v.acidez]||"",
      v.crianzaMeses!=null?v.crianzaMeses:"", v.alcohol!=null?v.alcohol:"",
      (v.perfil||[]).join(" / "), v.maridaje, v.notas].map(q).join(",");
  });
  const csv = "﻿" + [cab.map(q).join(",")].concat(filas).join("\r\n");
  if(S.descargas){
    S.descargas.save({filename:`cava-${HOY.toISOString().slice(0,10)}.csv`, data:csv})
      .then(()=>toast("CSV listo")).catch(()=>toast("No se pudo descargar el CSV"));
  } else {
    navigator.clipboard?.writeText(csv).then(()=>toast("CSV copiado al portapapeles"))
      .catch(()=>toast("No pude exportar en este visor"));
  }
}

/* ============== persistencia ============== */

function idNuevo(){ return "v" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function limpiar(o){
  const out = {};
  for(const k of Object.keys(o)) if(!k.startsWith("_") && o[k] !== undefined) out[k] = o[k];
  return out;
}

async function guardar(v){
  const datos = limpiar(Object.assign({}, v, {actualizado:new Date().toISOString()}));
  const id = datos.id || idNuevo();
  datos.id = id;
  const i = S.vinos.findIndex(x=>x.id===id);
  if(i >= 0) S.vinos[i] = datos; else S.vinos.push(datos);
  render();
  if(S.db){
    try{ await S.db.collection("vinos").doc(id).set(datos); }
    catch(e){ toast("Guardado solo en esta pantalla: no pude escribir en la cava compartida"); }
  }
}

async function borrar(id){
  S.vinos = S.vinos.filter(v=>v.id!==id);
  render();
  if(S.db){ try{ await S.db.collection("vinos").doc(id).delete(); }catch(e){} }
}

});

document.querySelector("main").addEventListener("click", e => {

  if(ag){ abrirAlta(); return; }
  const th = e.target.closest("[data-horiz]");
  if(th){
    S.fHoriz = th.dataset.horiz; S.fEstado = ""; S.view = "cava";

    const pos = e.target.selectionStart;
    render();
    const n = $("#f-q"); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  }
});
document.querySelector("main").addEventListener("change", e => {
  if(e.target.id === "f-estado"){ S.fEstado = e.target.value; render(); }
  if(e.target.id === "f-var"){ S.fVar = e.target.value; render(); }
  if(e.target.id === "f-orden"){ S.orden = e.target.value; render(); }
});

render();

(async function(){
  const c = window.claude;
  if(!c || !c.use){ S.listo = true; render(); return; }

  const [db, sample, assets, descargas] = await Promise.all([
    c.use("db").catch(()=>null),
    c.use("sample").catch(()=>null),
    c.use("assets").catch(()=>null),
    c.use("downloads").catch(()=>null)
  ]);
  S.db = db; S.sample = sample; S.assets = assets; S.descargas = descargas;

  if(sample){
    try{ const lim = await sample.limits(); S.puedeImagenes = !!(lim && lim.images); }
    catch(e){ S.puedeImagenes = false; }
  }

  if(!db){ S.listo = true; render(); return; }

  try{
    const snap = await db.doc("config/app").get();
    if(snap.exists){
      const d = snap.data();
      S.cfg = {bandas:Object.assign({}, CFG_DEF.bandas, d.bandas||{}), dolar:d.dolar||CFG_DEF.dolar, relevado:d.relevado||CFG_DEF.relevado};
    }
  }catch(e){ /* se queda con los valores por defecto */ }

  db.collection("vinos").onSnapshot(snap => {
    S.vinos = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    S.listo = true;
    render();
  }, () => { S.listo = true; render(); });
})();

})();
